<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oddity Studio</title><link rel="stylesheet" href="/studio.css"><script type="module" src="/studio.js"></script></head>
<body>
<header class="masthead"><a href="/" class="wordmark">ODDITY <em>Studio</em></a><p>Content &amp; scheduling</p><div class="publish-controls"><span id="save-state">Loading…</span><button id="reload" type="button">Reload</button><button id="save" type="button">Save draft</button><button id="publish" type="button" class="primary">Publish</button></div></header>
<nav aria-label="Studio sections"><button data-tab="blocks" aria-current="page">Blocks</button><button data-tab="programmes">Programmes</button><button data-tab="schedule">Schedule</button><button data-tab="collections">Collections</button><a href="http://127.0.0.1:8000/" target="_blank" rel="noopener">View station ↗</a></nav>
<p id="message" role="status" aria-live="polite"></p><section id="checks" aria-label="Publishing checks" hidden></section>
<main id="workspace" aria-busy="true"></main>
<footer><span id="published-state"></span><div><label for="history">Saved revisions</label><select id="history"></select><button id="restore" type="button">Restore draft</button><button id="export" type="button">Export JSON</button></div></footer>
</body></html>
