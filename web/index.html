<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark"><meta name="description" content="Watch Oddity Television live and browse the TV guide.">
  <title>Oddity Television — Live TV &amp; Guide</title>
  <link rel="stylesheet" href="/style.css"><script type="module" src="/player.js"></script>
</head>
<body>
  <button class="skip-link" id="skip-guide" type="button">Open TV guide</button>
  <main class="station">
      <section class="television" aria-label="Television player">
        <div class="tv-set" id="tv-set" data-picture="fit" data-caption-size="normal">

        <div class="screen" id="screen">
          <video id="video" playsinline preload="auto" aria-label="Live Oddity Television broadcast"></video>
          <video id="preload-video" playsinline preload="auto" muted hidden aria-hidden="true"></video>
          <div id="standby"><p>Oddity Television</p><button id="tune" class="primary">▶ Tune in</button></div>
          <div class="screen-info" id="screen-info" hidden><span class="osd-channel">01 <small>ODDITY TELEVISION</small></span><strong id="screen-title">Live television</strong><span id="screen-detail"></span></div>
          <div class="paused-overlay" id="paused-overlay" hidden><button id="resume-live" type="button" class="resume-button" aria-label="Resume at the live broadcast position"><span aria-hidden="true">▶</span></button><span>Paused</span><p>Resume joins live</p></div>
        </div>
        <div class="viewing-now" aria-hidden="true"><span class="block-label" id="viewing-block" hidden></span><div class="now-line"><span class="on-air-dot"></span><span id="viewing-title">Oddity Television</span></div><progress id="programme-progress" max="1" value="0"></progress><div class="next-programme" id="viewing-next" hidden>Next <span id="next-title"></span><span id="next-time"></span></div></div>
        <div class="tv-remote" role="group" aria-label="Television controls">
          <div class="transport-controls">
            <button id="transport" type="button" aria-label="Play live television" title="Play / pause (Space)"><span aria-hidden="true" id="transport-icon">▶</span><span class="sr-only" id="transport-label">Play live</span></button>
            <button id="sound" type="button" aria-label="Turn sound on" title="Sound (M)"></button>
            <label class="volume-control"><span class="sr-only">Volume</span><input id="volume" type="range" min="0" max="100" step="1" value="70" aria-label="Volume"></label>
            <button id="live" type="button" class="live-control" title="Rejoin live (L)"><span class="dot"></span>LIVE</button>
          </div>
          <div class="screen-controls">
            <button id="guide-toggle" class="guide-toggle" type="button" aria-label="TV guide" aria-expanded="false" aria-controls="programme-guide" title="TV guide (G)"><span class="guide-icon" aria-hidden="true"></span><span>Guide</span></button>
            <button id="captions" type="button" aria-label="Turn subtitles on" aria-pressed="false" title="Subtitles (C)" disabled>CC</button>
            <button id="settings-toggle" type="button" aria-label="Picture and sound settings" aria-expanded="false" aria-controls="receiver-settings" title="Settings"></button>
            <button id="fullscreen" type="button" aria-label="Enter full screen" title="Full screen (F)"></button>
          </div>
        </div>
        <div class="receiver-settings" id="receiver-settings" hidden role="region" aria-label="Player settings">
          <header><strong>Settings</strong><button id="settings-close" type="button" aria-label="Close settings">×</button></header>
          <div class="settings-grid"><label>Picture<select id="picture"><option value="fit">Fit</option><option value="classic">4:3</option><option value="wide">16:9</option><option value="fill">Fill</option></select></label><label>Subtitles<select id="subtitle-track"><option value="off">Not available</option></select></label><label>Subtitle size<select id="caption-size"><option value="normal">Normal</option><option value="large">Large</option></select></label></div>
          <p id="subtitle-status" class="sr-only"></p>
          <div class="extra-controls"><button id="info" type="button" aria-label="Show programme information" aria-pressed="false" title="Programme information (I)">Programme info</button><button id="pip" type="button" aria-label="Picture-in-picture" aria-pressed="false" hidden>Picture in picture</button></div>
        </div>
        <p id="status" class="player-status" role="status" aria-live="polite"></p>
        </div>
      </section>

    <button class="guide-backdrop" id="guide-backdrop" type="button" aria-label="Close TV guide" tabindex="-1" hidden></button>
    <section class="programme-guide" id="programme-guide" aria-labelledby="guide-heading" hidden>
      <div class="sheet-handle" id="sheet-handle" aria-hidden="true"></div>
      <header class="guide-header">
        <h1 id="guide-heading">TV Guide</h1><button id="guide-close" type="button" aria-label="Close TV guide">×</button>
        <div class="guide-days" role="group" aria-label="Guide day"><button type="button" data-period="today" aria-pressed="true">Today</button><button type="button" data-period="tomorrow" aria-pressed="false">Tomorrow</button></div>
        <button id="guide-now" type="button">Now</button>
        <div class="guide-clock"><span id="guide-date"></span><time id="clock">--:--:--</time></div>
      </header>
      <div class="guide-editorial">
      <div class="block-banner" id="block-banner" hidden><span id="detail-programming-title"></span><p id="detail-programming-description"></p></div>
      <div class="programme-summary">
      <section class="programme-details" aria-labelledby="detail-title">
        <div class="selected-programme"><p id="detail-kind"></p><h2 id="detail-title">Loading guide…</h2><p><span id="detail-time"></span><span id="detail-block"></span></p></div>
        <button id="detail-watch" type="button" class="primary">Back to live</button>
      </section>
      <div class="programme-context"><p class="episode-meta" id="detail-episode" hidden></p><p id="detail-description" hidden></p><button id="description-more" type="button" aria-controls="detail-description" aria-expanded="false" hidden>More</button><div class="programme-tags" id="detail-tags" aria-label="Programme tags"></div></div>
      </div>
      </div>
      <div class="guide-navigation"><button id="guide-prev" type="button" aria-label="Earlier programmes">‹</button><span id="guide-window">Programme times</span><button id="guide-next" type="button" aria-label="Later programmes">›</button><button id="guide-refresh" type="button" aria-label="Refresh TV guide">↻</button><span id="guide-status" role="status" aria-live="polite">Loading…</span></div>
      <div class="guide-matrix">
        <div class="channel-rail"><span class="rail-heading">CH</span><button id="guide-channel" type="button" aria-label="Watch Oddity Television live"><span class="channel-number">01</span><strong id="guide-channel-name">Oddity Television</strong></button></div>
        <div id="guide-viewport" class="guide-viewport" role="region" aria-label="Programme timeline; scroll for later times" tabindex="0">
          <div id="guide-canvas" class="guide-canvas"><div id="guide-times" class="guide-times" aria-hidden="true"></div><ol id="guide" aria-label="Oddity Television broadcast schedule"></ol><div id="guide-playhead" class="guide-playhead" aria-hidden="true"><span>Now</span></div></div>
          <p id="guide-empty" class="guide-empty" hidden>No programmes available in this window. Try Now or refresh the guide.</p>
        </div>
      </div>
      <div class="guide-shortcuts" id="guide-shortcuts" role="group" aria-label="Short clips in this window"></div>
    </section>
  </main>
</body>
</html>
